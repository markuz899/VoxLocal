name: Bench velocità

# Temporaneo: misura whisper sullo stesso tipo di macchina, Windows (MSVC) contro Linux (gcc).
on:
  push:
    branches: [bench/windows-speed]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
          libssl-dev cmake clang
      - uses: dtolnay/rust-toolchain@stable
      - name: Processore
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -c "Get-CimInstance Win32_Processor | Select Name,NumberOfCores,NumberOfLogicalProcessors | Format-List"
          else
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
          fi
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --example bench
      - name: Base
        working-directory: src-tauri
        run: cargo run --release --example bench -- --model base --lang en --runs 2
      - name: Large v3 Turbo
        working-directory: src-tauri
        run: cargo run --release --example bench -- --model large-v3-turbo-q5_0 --lang en --runs 1
