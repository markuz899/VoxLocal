name: Bench velocità

# Temporaneo: con il generatore Visual Studio cmake-rs riscrive CMAKE_C_FLAGS_RELEASE senza /O2.
on:
  push:
    branches: [bench/windows-speed]

jobs:
  bench:
    runs-on: windows-latest
    env:
      GGML_NATIVE: "OFF"
      CMAKE_C_FLAGS_RELEASE: "-nologo -MD -O2 -Ob2 -DNDEBUG"
      CMAKE_CXX_FLAGS_RELEASE: "-nologo -MD -O2 -Ob2 -DNDEBUG /utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --example bench
      - name: Base
        working-directory: src-tauri
        run: cargo run --release --example bench -- --model base --lang en --runs 2
      - name: Large v3 Turbo
        working-directory: src-tauri
        run: cargo run --release --example bench -- --model large-v3-turbo-q5_0 --lang en --runs 1
