name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS: controlli completi (formattazione, lint, test, build del frontend).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Tauri vuole il sidecar llama-server anche solo per compilare: nei controlli basta un segnaposto
      # (quello vero lo compila il workflow di rilascio, scripts/build-llama-server.sh).
      - name: Sidecar segnaposto
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          touch "src-tauri/binaries/llama-server-$(rustc -vV | sed -n 's/^host: //p')$ext"
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features subscription-cli -- -D warnings
          cargo test --lib

  # Windows: whisper.cpp con MSVC, keyring, enigo e percorsi sono diversi da macOS.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Tauri vuole il sidecar llama-server anche solo per compilare: nei controlli basta un segnaposto
      # (quello vero lo compila il workflow di rilascio, scripts/build-llama-server.sh).
      - name: Sidecar segnaposto
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          touch "src-tauri/binaries/llama-server-$(rustc -vV | sed -n 's/^host: //p')$ext"
      - run: pnpm build
      - working-directory: src-tauri
        run: cargo test --lib

  # Linux è best-effort: basta che compili.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze di sistema
        run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libssl-dev
          cmake clang
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Tauri vuole il sidecar llama-server anche solo per compilare: nei controlli basta un segnaposto
      # (quello vero lo compila il workflow di rilascio, scripts/build-llama-server.sh).
      - name: Sidecar segnaposto
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          touch "src-tauri/binaries/llama-server-$(rustc -vV | sed -n 's/^host: //p')$ext"
      - run: pnpm build
      - working-directory: src-tauri
        run: cargo check --all-targets
