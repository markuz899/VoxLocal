name: Sito

# Pubblica site/ su GitHub Pages a ogni release e a ogni modifica del sito su main. Se c'è una
# release, copia gli installer con nomi fissi in site/downloads (quelli che la landing linka).
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer dell'ultima release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl site/downloads
          if ! gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Nessuna release ancora: il sito esce senza installer."
            exit 0
          fi
          gh release download --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern '*_universal.dmg' --pattern '*-setup.exe' \
            --pattern '*.AppImage' --pattern '*.deb'
          cp dl/*_universal.dmg site/downloads/VoxLocal-macOS.dmg
          cp dl/*-setup.exe site/downloads/VoxLocal-Windows-setup.exe
          cp dl/*.AppImage site/downloads/VoxLocal-Linux.AppImage
          cp dl/*.deb site/downloads/VoxLocal-Linux.deb
          ls -la site/downloads
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
