name: Release

# Ogni merge su main che tocca l'app esce come nuova versione: se la versione in package.json ha
# già un tag, sale la patch (0.2.0 → 0.2.1) con un commit del bot; poi tag, installer per i tre
# sistemi, release pubblicata e sito aggiornato. Per un salto minore o maggiore basta mettere
# a mano la nuova versione in package.json e Cargo.toml prima del merge.
on:
  push:
    branches: [main]
    paths-ignore: [site/**, docs/**, "**.md", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

# una release alla volta, mai annullata a metà
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: bump
        run: |
          cur=$(node -p "require('./package.json').version")
          next=$cur
          if git rev-parse -q --verify "refs/tags/v$cur" >/dev/null; then
            IFS=. read -r major minor patch <<<"$cur"
            next="$major.$minor.$((patch + 1))"
            node scripts/bump-version.mjs "$next"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release v$next"
            git push origin HEAD:main
          fi
          git tag "v$next"
          git push origin "v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      # L'updater legge latest.json dalle release di questo stesso repository.
      - name: Endpoint dell'updater
        shell: bash
        run: |
          sed -i.bak "s#GITHUB_REPOSITORY#${GITHUB_REPOSITORY}#" src-tauri/tauri.conf.json
          rm src-tauri/tauri.conf.json.bak
          grep -q "${GITHUB_REPOSITORY}" src-tauri/tauri.conf.json

      - name: Dipendenze Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
          libssl-dev cmake clang

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile

      # Firma e notarizzazione Apple solo se i segreti esistono: senza, la build resta firmata
      # ad-hoc (installabile, ma macOS mostra l'avviso "sviluppatore non identificato").
      - name: Credenziali Apple
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: VoxLocal __VERSION__
          releaseBody: Vedi docs/INSTALL.md per l'installazione.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # La release resta in bozza finché tutti e tre i sistemi non hanno caricato i file.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY"
          --draft=false --latest

  # Una release pubblicata dal bot non avvia altri workflow: il sito si aggiorna da qui.
  site:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
