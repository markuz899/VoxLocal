<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>VoxLocal</title>
    <link rel="stylesheet" href="/src/palette/palette.css" />
  </head>
  <body>
    <div class="card" role="dialog" aria-labelledby="field">
      <label class="field">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 2.5v7" />
          <path d="M5.5 7a2.5 2.5 0 0 0 5 0" />
          <path d="M8 11.5v2" />

        <input id="field" autocomplete="off" spellcheck="false" />

      <div id="group" class="group"></div>
      <ul id="list" role="listbox"></ul>
      <div class="foot">
        <span id="hint"></span
        ><span><kbd>Esc</kbd> <span id="esc"></span></span>
      </div>
    </div>
    <script type="module" src="/src/palette/palette.ts"></script>
