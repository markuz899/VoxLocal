[package]
name = "voxlocal"
version = "0.1.0"
edition = "2021"

[lib]
name = "voxlocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Provider LLM che usano l'abbonamento Claude/Codex via CLI: solo per build personali,
# esclusi dalla build commerciale (DECISIONS D22, OPEN_QUESTIONS Q14).
subscription-cli = []

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
cpal = "0.18.2"
dirs = "7.0.0"
enigo = "0.6.1"
futures-util = "0.3.34"
hex = "0.4.3"
hound = "3.5.1"
keyring = "4.2.0"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "multipart"] }
rtrb = "0.4.1"
rubato = "5.1.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-store = "2.5.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "process"] }
tokio-util = "0.7.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["log_backend"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal", "log_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
